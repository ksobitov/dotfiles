set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Reload tmux configuration
bind r source-file ~/.tmux.conf \; display-message "Config reloaded."

set -g status-interval 1

# Set default terminal mode to 256 colors
#set -g default-terminal "screen-256color"

set -g default-terminal "tmux-256color"

# Improve pane splitting behavior
bind | split-window -h
bind - split-window -v

# Better pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable vi-style copy mode
setw -g mode-keys vi

# Enable mouse support
set -g mouse on

set -g status-right-length 100
set -g status-right "%Y-%m-%d | %H:%M:%S | Mem: #(free -h | awk '/^Mem/ {print $3 \"/\" $2}') "
set -g status-interval 1

# Enable copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Paste buffer integration
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"
bind-key C-v run "tmux set-buffer \"$(xclip -o -selection clipboard)\"; tmux paste-buffer"

# Bind a key to toggle pane synchronization
#bind-key g setw synchronize-panes
# Toggle synchronization and display a message
bind-key g setw synchronize-panes \; display-message "Synchronized Panes: #{?pane_synchronized,on,off}"

# Select panes using Ctrl + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n S-Left  previous-window
bind -n S-Right next-window

# Prefix + u: duplicate current pane in a new split
bind-key -T prefix u run-shell _tmux_duplicate_pane

run '~/.tmux/plugins/tpm/tpm'
